version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5001:5001"
    volumes:
      - ./storage:/app/storage
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - STORAGE_PATH=/app/storage
      - UPLOAD_PATH=/app/uploads
    networks:
      - app-network

  mcp:
    build: .
    command: ["python3", "mcp_server.py"]
    ports:
      - "8765:8765"
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env
    environment:
      - THREATSHIELD_BACKEND_URL=http://backend:5001
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8765
      - STORAGE_PATH=/app/storage
    depends_on:
      - backend
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - REACT_APP_DEPLOYMENT_TYPE=${REACT_APP_DEPLOYMENT_TYPE}
        - REACT_APP_API_URL_DEV=${REACT_APP_API_URL_DEV}
        - REACT_APP_API_URL_STAGE=${REACT_APP_API_URL_STAGE}
        - REACT_APP_API_URL_PROD=${REACT_APP_API_URL_PROD}
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
